<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- HubSpot tracking: pageviews and UTM attribution on every route (this is a single-page app, so one tag here covers all of them). Portal/Hub ID 22442713, not a secret. -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/22442713.js"></script>
    <!-- Title, description, keywords, canonical, Open Graph, Twitter card and JSON-LD (including Organization) are no
         longer hardcoded here — they're written per-route into each page's own dist/<route>/index.html by
         scripts/prerender.mjs at build time (source of truth: each page's own <PageSeo>/<OrganizationSeo>), so a
         crawler that never runs JavaScript still sees the real, correct tags for that exact page. This title is only
         a fallback, for the instant before the SSR markup below it is replaced (it never is, outside dev mode: `npm
         run dev` serves this raw file, uses this title, and has no prerendered content — exactly like before). -->
    <title>AltiusNxt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
